<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>EDILBINGO VIP ROOM</title>


    <!-- =========================================================
         TELEGRAM MINI APP SDK
         Load ONCE
         ========================================================= -->

    <script src="https://telegram.org/js/telegram-web-app.js"></script>


    <!-- =========================================================
         EDILBINGO VIP ROOM CSS
         ========================================================= -->

    <link
        rel="stylesheet"
        href="/vip-room.css?v=2"
    >

</head>


<body>


    <!-- =========================================================
         TELEGRAM / EDILBINGO HEADER
         ========================================================= -->

    <header class="telegram-header">

        <button
            id="backButton"
            class="telegram-back"
            type="button"
        >
            ←
        </button>


        <div class="telegram-title">
            EDILBINGO
        </div>


        <div
            id="telegramUser"
            class="telegram-user"
        >
            Player
        </div>

    </header>


    <!-- =========================================================
         MAIN VIP ROOM
         ========================================================= -->

    <main class="vip-container">


        <!-- =====================================================
             ROOM HEADER
             ===================================================== -->

        <section class="room-header">

            <div>

                <div class="room-label">
                    ROOM
                </div>


                <h1 id="roomName">
                    VIP
                </h1>

            </div>


            <div class="connection-box">

                <span id="connectionStatus">
                    🔴 Connecting...
                </span>

            </div>

        </section>



        <!-- =====================================================
             GAME INFORMATION
             ===================================================== -->

        <section class="game-info">


            <!-- SOLD -->

            <div class="info-card">

                <span class="info-label">
                    SOLD
                </span>

                <strong id="soldCount">
                    0
                </strong>

            </div>


            <!-- TIME -->

            <div class="info-card">

                <span class="info-label">
                    TIME
                </span>

                <strong id="timer">
                    30s
                </strong>

            </div>


            <!-- BALANCE -->

            <div class="info-card">

                <span class="info-label">
                    BALANCE
                </span>

                <strong>

                    <span id="balance">
                        200.00
                    </span>

                    ETB

                </strong>

            </div>

        </section>



        <!-- =====================================================
             NUMBER GRID
             ===================================================== -->

        <section class="numbers-section">

            <div
                id="numbers"
                class="numbers"
            ></div>

        </section>



        <!-- =====================================================
             CARD SLOTS
             ===================================================== -->

        <section class="cards-section">


            <!-- SLOT 1 -->

            <div
                id="slot1"
                class="card-slot"
            >

                <div class="plus">
                    +
                </div>

                <div class="slot-title">
                    SLOT 1 EMPTY
                </div>

            </div>


            <!-- SLOT 2 -->

            <div
                id="slot2"
                class="card-slot"
            >

                <div class="plus">
                    +
                </div>

                <div class="slot-title">
                    SLOT 2 EMPTY
                </div>

            </div>

        </section>



        <!-- =====================================================
             BUY BUTTON
             ===================================================== -->

        <section class="purchase-section">

            <button
                id="buyButton"
                class="buy-button"
                disabled
                type="button"
            >
                SELECT A NUMBER
            </button>

        </section>


    </main>



    <!-- =========================================================
         SOCKET.IO
         Load ONCE
         ========================================================= -->

    <script src="/socket.io/socket.io.js"></script>


    <!-- =========================================================
         EDILBINGO TELEGRAM CONFIGURATION
         Load BEFORE vip-room.js
         ========================================================= -->

    <script src="/js/telegram.js?v=2"></script>


    <!-- =========================================================
         EDILBINGO VIP ROOM JAVASCRIPT
         Load LAST
         ========================================================= -->

    <script src="/vip-room.js?v=2"></script>


</body>

</html>
